{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Releva{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-header">
            <h1>Iniciar Sesión</h1>
            <p>Ingresa tus credenciales para acceder</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-error">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'core:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Usuario</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-input" 
                    placeholder="Ingresa tu usuario" 
                    required 
                    autofocus 
                />
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="••••••••" 
                    required 
                />
            </div>

            <div class="form-group">
                <label for="area_id">Área de Desempeño <span style="font-size: 0.8rem; color: #64748b; font-weight: normal;">(Opcional para coordinadores)</span></label>
                <select name="area_id" id="area_id" class="form-input">
                    <option value="">-- Selecciona tu Área (Opcional) --</option>
                    {% for a in areas %}
                        <option value="{{ a.id }}">{{ a.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Iniciar Sesión
            </button>
        </form>
    </div>
</div>
{% endblock %}
